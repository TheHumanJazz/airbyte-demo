apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: airflow
spec:
  interval: 30m0s
  chart:
    spec:
      chart: airflow
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: Create
  values:
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false
    ingress:
      apiServer:
        enabled: true
        ingressClassName: nginx
        hosts:
          - airflow.localtest.me
        path: /
        pathType: Prefix
        tls:
          enabled: false
